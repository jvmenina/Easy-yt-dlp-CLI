name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            artifact_name: easy_ytdlp_cli
            artifact_path: build/easy_ytdlp_cli
            asset_name: easy_ytdlp_cli-linux-x64
          - os: windows-latest
            artifact_name: easy_ytdlp_cli.exe
            artifact_path: build/Release/easy_ytdlp_cli.exe
            asset_name: easy_ytdlp_cli-windows-x64.exe

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure CMake (Linux)
      if: runner.os == 'Linux'
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Configure CMake (Windows)
      if: runner.os == 'Windows'
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build --config Release

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.asset_name }}
        path: ${{ matrix.artifact_path }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    # NOTE: Only create releases on tags
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: ./artifacts

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          artifacts/**/*
        draft: true
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
