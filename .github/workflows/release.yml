name: Build and Release

on:
  # push:
  #   tags:
  #     - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        type: string
      release_name:
        description: 'Release name'
        required: true
        type: string
        default: '${{ inputs.release_tag }}'
      release_notes:
        description: 'Release notes'
        required: false
        type: string
        default: ''
      prerelease:
        description: 'Set as a pre-release'
        required: false
        type: boolean
        default: false
      draft:
        description: 'Set as a draft'
        required: false
        type: boolean
        default: false

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        platform: [Linux, Windows]
        include:
          - os: ubuntu-latest
            asset_suffix: '-linux'
            asset_ext: ''
          - os: windows-latest
            asset_suffix: '-windows-x64'
            asset_ext: '.exe'

    env:
      asset_base_name: easy_ytdlp_cli

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build
      run: make TARGET=${{ env.asset_base_name }}${{ matrix.asset_suffix }}

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.asset_base_name }}${{ matrix.asset_suffix }}
        path: ${{ env.asset_base_name }}${{ matrix.asset_suffix }}${{ matrix.asset_ext }}

  release:
    name: Create Release
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: ./artifacts

    - name: Publish release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ inputs.release_tag }}
        name: ${{ inputs.release_name }}
        body: ${{ inputs.release_notes }}
        draft: ${{ inputs.draft }}
        prerelease: ${{ inputs.prerelease }}
        files: |
          ./artifacts/**/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
